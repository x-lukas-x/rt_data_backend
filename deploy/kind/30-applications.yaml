apiVersion: v1
kind: Service
metadata:
  name: read-service
  namespace: processing
spec:
  selector:
    app: read-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: read-service
  namespace: processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: read-service
  template:
    metadata:
      labels:
        app: read-service
    spec:
      initContainers:
        - name: wait-for-inventory-import
          image: rt-data-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - services.common.wait_for
            - http://inventory-service.database.svc.cluster.local:8080/health/ready
      containers:
        - name: read-service
          image: rt-data-backend:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.read_api.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: INVENTORY_URL
              value: http://inventory-service.database.svc.cluster.local:8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-processor
  namespace: processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-processor
  template:
    metadata:
      labels:
        app: sales-processor
    spec:
      initContainers:
        - name: wait-for-inventory-import
          image: rt-data-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - services.common.wait_for
            - http://inventory-service.database.svc.cluster.local:8080/health/ready
      containers:
        - name: sales-processor
          image: rt-data-backend:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.sales_processor.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: INVENTORY_URL
              value: http://inventory-service.database.svc.cluster.local:8080
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.streaming.svc.cluster.local:9092
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 400m
              memory: 256Mi
---
