apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: database
spec:
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: rt-data-backend:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.inventory.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rtdata-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rtdata-db
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres.database.svc.cluster.local:5432/rtdata
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: csv-import
  namespace: database
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: initial-import
          image: rt-data-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.csv_import.main"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: rtdata-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rtdata-db
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres.database.svc.cluster.local:5432/rtdata
            - name: CSV_PATH
              value: /app/data/Grocery_Inventory_Dataset.csv
