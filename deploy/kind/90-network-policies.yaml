apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-traffic
  namespace: streaming
spec:
  podSelector:
    matchLabels: {app: gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app: kafka}
      ports:
        - {protocol: TCP, port: 9092}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: processing
          podSelector:
            matchLabels: {app: read-service}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop-a
          podSelector:
            matchLabels: {app: warning-handler}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop-b
          podSelector:
            matchLabels: {app: warning-handler}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop-n
          podSelector:
            matchLabels: {app: warning-handler}
      ports:
        - {protocol: TCP, port: 8080}
---
