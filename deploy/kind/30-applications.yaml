apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: streaming
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: wait-for-read-service
          image: rt-data-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - services.common.wait_for
            - http://read-service.processing.svc.cluster.local:8080/health/ready
      containers:
        - name: gateway
          image: rt-data-backend:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "services.gateway.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: kubernetes
            - name: SHOP_IDS
              value: shop-a,shop-b,shop-n
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.streaming.svc.cluster.local:9092
            - name: READ_API_URL
              value: http://read-service.processing.svc.cluster.local:8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 400m
              memory: 256Mi
